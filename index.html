<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snapmake: photo in, steps out</title>
  <meta name="description" content="Take a photo of what you have, say what you want to make, and get simple step-by-step instructions. Free." />
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://js.puter.com/v2/" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="logo" href="./" aria-label="Snapmake home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor"/><circle cx="12" cy="12" r="4.2" fill="var(--accent)"/></svg>
      Snapmake
    </a>
    <button class="ghost-btn" id="historyBtn" type="button" aria-label="Saved plans">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1 1 0 011 1V21l-6-4-6 4V4.5a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Saved</span><b class="count" id="savedCount" hidden>0</b>
    </button>
  </header>

  <main>
    <!-- HOME -->
    <section class="view home is-active" id="viewCompose">
      <h1>What do you want to make?</h1>
      <p class="sub">Add a photo of what you have. Get simple steps to make it.</p>

      <form class="composer" id="composer" autocomplete="off">
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <div class="drop" id="tray" role="button" tabindex="0" aria-label="Add a photo">
          <div class="drop-empty" id="trayEmpty">
            <span class="drop-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 016.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0120 8.5v9A2.5 2.5 0 0117.5 20h-11A2.5 2.5 0 014 17.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
            </span>
            <span class="drop-title">Add a photo</span>
            <span class="drop-hint">Take one, upload, or drop it here</span>
          </div>
          <ul class="thumbs" id="thumbs" hidden></ul>
        </div>
        <div class="field">
          <textarea id="goal" rows="1" maxlength="600" placeholder="What should it become?"></textarea>
          <button class="send" id="makeBtn" type="submit" aria-label="Make it">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>

      <div class="chips" id="chips"></div>

      <p class="foot">
        <button class="text-btn" id="exampleBtn" type="button">See an example</button>
        <span class="dot-sep">·</span>
        Free AI by <a href="https://puter.com" target="_blank" rel="noopener">Puter</a>. One-time sign-in, no cost.
      </p>
    </section>

    <!-- WORKING -->
    <section class="view scan" id="viewScan" aria-live="polite">
      <div class="scan-media" id="scanFrame">
        <img id="scanImg" alt="" />
        <div class="scan-sweep" aria-hidden="true"></div>
        <div class="tags" id="scanTags"></div>
      </div>
      <p class="scan-status" id="scanStatus">Looking at your photo…</p>
      <div class="scan-bar"><div id="scanBar"></div></div>
      <button class="text-btn" id="cancelBtn" type="button">Cancel</button>
    </section>

    <!-- RESULT -->
    <section class="view result" id="viewResult"></section>
  </main>

  <!-- Step-by-step mode -->
  <div class="focus" id="focus" role="dialog" aria-modal="true" aria-label="Step-by-step" hidden>
    <div class="focus-top">
      <button class="round" id="focusClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="focus-track"><div id="focusBar"></div></div>
      <button class="round" id="focusSpeak" type="button" aria-label="Read aloud" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a7.8 7.8 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="focus-body" id="focusBody"></div>
    <div class="focus-nav">
      <button class="btn btn-quiet" id="focusPrev" type="button">Back</button>
      <button class="btn btn-light" id="focusNext" type="button">Next</button>
    </div>
  </div>

  <!-- Saved -->
  <aside class="sheet" id="drawer" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet-panel" role="dialog" aria-label="Saved plans">
      <div class="sheet-head">
        <h2>Saved</h2>
        <button class="round" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <ul class="saved" id="savedList"></ul>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
